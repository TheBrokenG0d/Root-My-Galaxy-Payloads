name: Build SM-F966U BZG3 diagnostic

on:
  push:
    branches:
      - build-sm-f966u-bzg3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android NDK r29
        run: |
          curl -L --fail --retry 3 -o android-ndk-r29-linux.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          echo "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  android-ndk-r29-linux.zip" | sha1sum -c -
          unzip -q android-ndk-r29-linux.zip

      - name: Build exact target
        run: |
          make TARGET=q7q-F966USQSBBZG3 ANDROID_NDK_HOME="$PWD/android-ndk-r29" all
          sha256sum build/q7q-F966USQSBBZG3/*

      - uses: actions/upload-artifact@v4
        with:
          name: q7q-F966USQSBBZG3-diagnostic
          path: build/q7q-F966USQSBBZG3/
          if-no-files-found: error
